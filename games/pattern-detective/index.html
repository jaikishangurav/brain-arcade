<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Detective</title>
<link rel="stylesheet" href="../../shared.css">
<style>
  .seq { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:18px 0 8px; }
  .chip { min-width:54px; height:58px; padding:0 8px; border-radius:12px; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:clamp(24px, 6vw, 34px); font-weight:bold; }
  .chip.q { background:transparent; border:3px dashed var(--accent); color:var(--accent); }
  .chip.found { background:#1f6b3a; border:3px solid var(--good); color:#fff; }
  .choices { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  .choice { min-width:84px; height:64px; border-radius:14px; border:0; background:#4a3a9a; color:#fff; font-size:30px; font-weight:bold; cursor:pointer; box-shadow:0 5px 0 #2b2166; font-family:inherit; }
  .choice:hover:not(:disabled) { background:#5b4abb; }
  .choice:disabled { opacity:.3; cursor:default; }
  .progress { display:flex; gap:6px; justify-content:center; margin-bottom:4px; }
  .progress span { width:26px; height:8px; border-radius:4px; background:#2a3260; }
  .progress span.done { background:var(--good); }
  .progress span.now { background:var(--accent); }
  .msg { min-height:48px; text-align:center; font-size:17px; }
  .cases { display:grid; gap:10px; margin-top:12px; }
  .cases .btn { text-align:left; }
  .cases small { display:block; font-weight:normal; opacity:.8; }
  .emoji-q { font-size:clamp(28px, 7vw, 40px); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../../">← Arcade</a>
    <h1>🔍 Pattern Detective</h1>
    <div class="hud" id="hud"></div>
  </header>
  <div class="card" id="screen"></div>
</div>

<script src="../../profile.js"></script>
<script>
"use strict";
const PUZZLES = 8, LIVES = 3;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const range = (n, f) => Array.from({length:n}, (_, i) => f(i));

const ICONS = ["🔴","🔵","🟢","🟡","⭐","🌙","🪐","🧱","🚀","🌍"];
const UNITS = ["AB","AAB","ABB","ABC","AABB","ABAC"];

// Each generator returns { seq:[shown items], ans, rule, emoji?:true }
const emojiGen = () => {
  const unit = pick(UNITS), letters = [...new Set(unit)];
  const icons = shuffle(ICONS).slice(0, letters.length), map = Object.fromEntries(letters.map((l, i) => [l, icons[i]]));
  const full = range(8, i => map[unit[i % unit.length]]);
  return { seq:full.slice(0, 7), ans:full[7], emoji:true, rule:`The group ${unit.split("").map(l => map[l]).join("")} repeats again and again.` };
};
const addGen = (lo, hi) => () => { const s = rnd(1, 20), n = rnd(lo, hi); return { seq:range(5, i => s + n*i), ans:s + n*5, rule:`Add ${n} each time.` }; };
const subGen = () => { const n = rnd(3, 9), s = rnd(50, 99); return { seq:range(5, i => s - n*i), ans:s - n*5, rule:`Subtract ${n} each time.` }; };
const doubleGen = () => { const s = rnd(1, 4); return { seq:range(5, i => s * 2**i), ans:s * 2**5, rule:"Double the number each time (×2)." }; };
const altGen = () => { const a = rnd(4, 9), b = rnd(1, 3); let s = rnd(1, 10); const seq = [s]; for (let i = 0; i < 6; i++) { s += i % 2 === 0 ? a : -b; seq.push(s); } return { seq:seq.slice(0, 6), ans:seq[6], rule:`The steps take turns: +${a}, then −${b}, then +${a}, then −${b}…` }; };
const growGen = () => { const d = rnd(1, 2), s = rnd(1, 6); const seq = [s]; for (let i = 0; i < 5; i++) seq.push(seq[i] + d + i); return { seq:seq.slice(0, 5), ans:seq[5], rule:`The jump grows by 1 each time: +${d}, +${d+1}, +${d+2}…` }; };
const squareGen = () => { const k = rnd(1, 3); return { seq:range(5, i => (k+i)**2), ans:(k+5)**2, rule:`Square numbers: ${range(3, i => `${k+i}×${k+i}`).join(", ")}…` }; };
const fibGen = () => { const a = rnd(1, 5), b = rnd(1, 5); const s = [a, b]; for (let i = 2; i < 7; i++) s.push(s[i-1] + s[i-2]); return { seq:s.slice(0, 6), ans:s[6], rule:"Add the two numbers before it to get the next one (like Fibonacci)." }; };
const tripleGen = () => { const s = rnd(1, 3); return { seq:range(4, i => s * 3**i), ans:s * 3**4, rule:"Multiply by 3 each time." }; };
const triGen = () => { const k = rnd(1, 2), T = n => n*(n+1)/2; return { seq:range(5, i => T(k+i)), ans:T(k+5), rule:"Triangular numbers: the jumps are +2, +3, +4, +5… each one bigger." }; };
const cubeGen = () => ({ seq:[1, 8, 27, 64], ans:125, rule:"Cube numbers: 1×1×1, 2×2×2, 3×3×3, 4×4×4, 5×5×5." });
const weaveGen = () => { const a = rnd(1, 5); return { seq:range(6, i => i % 2 === 0 ? a + i/2 : 10 * (1 + (i-1)/2)), ans:a + 3, rule:"Two patterns take turns: one goes +1, the other goes +10." }; };
const dblPlusGen = () => { const s = rnd(1, 3); const q = [s]; for (let i = 0; i < 5; i++) q.push(q[i] * 2 + 1); return { seq:q.slice(0, 5), ans:q[5], rule:"Double it, then add 1." }; };

const CASES = {
  rookie:    { name:"Rookie Case",   icon:"🕵️", note:"Repeating pictures and counting by steps", gens:[emojiGen, emojiGen, addGen(2, 5), addGen(2, 10)] },
  detective: { name:"Detective Case", icon:"🔎", note:"Adding, subtracting, doubling, squares",  gens:[addGen(3, 12), subGen, doubleGen, altGen, growGen, squareGen] },
  chief:     { name:"Chief Inspector", icon:"🧠", note:"Tricky rules: Fibonacci, triangles, weaves", gens:[fibGen, tripleGen, triGen, cubeGen, weaveGen, dblPlusGen] },
};

let best = {};
try { const s = JSON.parse(localStorage.getItem("pd-best")); if (s && typeof s === "object") best = s; } catch(e) {}
const saveBest = () => { try { localStorage.setItem("pd-best", JSON.stringify(best)); } catch(e) {} };

let g = null;

function choicesFor(p) {
  if (p.emoji) return shuffle([p.ans, ...shuffle(ICONS.filter(i => i !== p.ans)).slice(0, 3)]);
  const last = p.seq[p.seq.length - 1], step = p.ans - last;
  const cand = [p.ans + 1, p.ans - 1, p.ans + 2, p.ans - 2, p.ans + 10, p.ans - 10, last + step + step, last, p.ans * 2];
  const set = [...new Set(cand.filter(n => n >= 0 && n !== p.ans))];
  return shuffle([p.ans, ...shuffle(set).slice(0, 3)]);
}

function renderHud() {
  $("hud").innerHTML = g ? `<span>${"🔍".repeat(g.lives)}${"▫️".repeat(LIVES - g.lives)}</span><span>🗂️ ${g.clues}/${PUZZLES}</span>` : "";
}
function showStart() {
  g = null; renderHud();
  const stars = k => best[k] ? "⭐".repeat(best[k]) + "☆".repeat(3 - best[k]) : "☆☆☆";
  $("screen").innerHTML = `<h2 style="margin-top:0">Choose your case</h2>
    <p class="muted">Every puzzle hides a secret rule. Find it and name the missing piece. You have 3 magnifying glasses, and each wrong guess uses one up.</p>
    <div class="cases">${Object.entries(CASES).map(([k,c]) => `<button class="btn" data-c="${k}">${c.icon} ${c.name} <span style="float:right">${stars(k)}</span><small>${c.note}</small></button>`).join("")}</div>`;
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => start(b.dataset.c));
}
function start(c) {
  g = { c, i:0, lives:LIVES, clues:0, solvedAll:true };
  Profile.play("pattern-detective");
  nextPuzzle();
}
function nextPuzzle() {
  const gens = CASES[g.c].gens;
  let p, tries = 0;
  do { p = pick(gens)(); } while (g.prev && JSON.stringify(g.prev) === JSON.stringify(p.seq) && ++tries < 5);
  g.prev = p.seq; g.p = p; g.choices = choicesFor(p); g.dead = new Set(); g.solved = false; g.msg = "";
  render();
}

function render() {
  renderHud();
  const p = g.p;
  const dots = range(PUZZLES, i => `<span class="${i < g.i ? "done" : i === g.i ? "now" : ""}"></span>`).join("");
  const chips = p.seq.map(x => `<div class="chip${p.emoji ? " emoji-q" : ""}">${x}</div>`).join("") +
    `<div class="chip q${g.solved ? " found" : ""}${p.emoji ? " emoji-q" : ""}">${g.solved ? p.ans : "?"}</div>`;
  $("screen").innerHTML = `<div class="progress">${dots}</div>
    <div class="center muted">Case file ${g.i + 1} of ${PUZZLES} · what comes next?</div>
    <div class="seq">${chips}</div>
    <div class="choices">${g.choices.map((c, k) => `<button class="choice" data-k="${k}" ${g.dead.has(k) || g.solved ? "disabled" : ""}>${c}</button>`).join("")}</div>
    <div class="msg" id="msg">${g.msg}</div>
    ${g.solved ? `<div class="center"><button class="btn" id="nx">${g.i + 1 >= PUZZLES ? "Close the case 📁" : "Next clue ▶"}</button></div>` : ""}`;
  document.querySelectorAll(".choice").forEach(b => b.onclick = () => choose(+b.dataset.k));
  if ($("nx")) { $("nx").onclick = advance; $("nx").focus(); }
}

function choose(k) {
  if (g.solved) return;
  if (g.choices[k] === g.p.ans) {
    g.solved = true; g.clues++;
    Profile.award("pattern-detective", 1, "Clue found");
    g.msg = `<span class="good">🔍 Clue found!</span> <span class="muted">${g.p.rule}</span>`;
    render();
  } else {
    g.dead.add(k); g.lives--; g.solvedAll = false;
    if (g.lives <= 0) return gameOver();
    g.msg = `<span class="bad">That's a red herring! Look at the pattern again.</span>`;
    render();
  }
}
function advance() {
  g.i++;
  if (g.i >= PUZZLES) return closeCase();
  nextPuzzle();
}
function closeCase() {
  const stars = g.lives;
  Profile.award("pattern-detective", 3 + g.lives, "Case closed!");
  if (g.lives === LIVES) Profile.unlock("pd-perfect");
  if (g.c === "chief") Profile.unlock("pd-chief");
  if (!best[g.c] || stars > best[g.c]) { best[g.c] = stars; saveBest(); }
  renderHud();
  $("screen").innerHTML = `<div class="center"><div style="font-size:72px">📁🏅</div><h2 style="margin-top:0">Case closed!</h2>
    <p>You solved all ${PUZZLES} clues with ${g.lives} magnifying ${g.lives === 1 ? "glass" : "glasses"} left.<br>${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}${stars === 3 ? " A perfect detective!" : ""}</p>
    <div class="row"><button class="btn" id="again">Take another case</button><button class="btn alt" id="menu">Change case</button></div></div>`;
  $("again").onclick = () => start(g.c); $("menu").onclick = showStart;
}
function gameOver() {
  renderHud();
  $("screen").innerHTML = `<div class="center"><div style="font-size:72px">🌫️</div><h2 style="margin-top:0">The trail went cold…</h2>
    <p>The rule was: <b>${g.p.rule}</b></p><p class="muted">You found ${g.clues} of ${PUZZLES} clues. Every great detective has an unsolved case or two!</p>
    <div class="row"><button class="btn" id="again">Try again</button><button class="btn alt" id="menu">Change case</button></div></div>`;
  $("again").onclick = () => start(g.c); $("menu").onclick = showStart;
}

showStart();
</script>
</body>
</html>
