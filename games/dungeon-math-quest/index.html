<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Math Quest</title>
<link rel="stylesheet" href="../../shared.css">
<style>
  .arena { display:flex; align-items:center; justify-content:space-around; padding:18px 6px; font-size:clamp(56px, 14vw, 96px); }
  .vs { font-size:24px; color:var(--muted); }
  .bar { height:12px; border-radius:6px; background:#2a3260; overflow:hidden; width:min(70vw, 260px); margin:6px auto 0; }
  .bar > i { display:block; height:100%; background:#e5484d; transition:width .3s; }
  .mon { text-align:center; }
  .monname { font-size:16px; font-weight:bold; }
  .problem { font-size:clamp(34px, 9vw, 54px); text-align:center; margin:6px 0 12px; font-weight:bold; letter-spacing:1px; }
  .answer { display:flex; gap:10px; justify-content:center; }
  .answer input { width:150px; font-size:30px; text-align:center; border-radius:12px; border:3px solid #3a47a0; background:var(--bg); color:var(--ink); padding:6px; font-family:inherit; }
  .answer input:focus { outline:none; border-color:var(--accent); }
  .msg { min-height:28px; text-align:center; margin-top:10px; font-size:17px; }
  .modes { display:grid; gap:10px; margin-top:12px; }
  .modes .btn { text-align:left; }
  .modes small { display:block; font-weight:normal; opacity:.8; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../../">← Arcade</a>
    <h1>⚔️ Dungeon Math Quest</h1>
    <div class="hud" id="hud"></div>
  </header>
  <div class="card" id="screen"></div>
</div>

<script src="../../profile.js"></script>
<script>
"use strict";
const ROOMS = 10, MAX_HP = 5;
const MONSTERS = [
  ["🐀","Rat"],["🦇","Bat"],["🕷️","Spider"],["🐍","Snake"],["🐺","Wolf"],
  ["🧟","Zombie"],["👻","Ghost"],["🧌","Troll"],["👹","Ogre"],["🐉","Dragon"],
];
const MODES = {
  addsub:   { name:"Add & Subtract", note:"Warm-up dungeon",            ops: r => ["+","-"] },
  timesdiv: { name:"Times & Divide", note:"Multiplication tables!",     ops: r => ["×","÷"] },
  mix:      { name:"Mixed Mayhem",   note:"Everything, getting harder", ops: r => r < 4 ? ["+","-"] : r < 6 ? ["+","-","×"] : ["+","-","×","÷"] },
};
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

let best = { gold:0, rooms:0 };
try { const s = JSON.parse(localStorage.getItem("dmq-best")); if (s && typeof s.gold === "number") best = s; } catch(e) {}
const saveBest = () => { try { localStorage.setItem("dmq-best", JSON.stringify(best)); } catch(e) {} };

let g = null;   // current run

function gen(room, mode) {
  const op = pick(MODES[mode].ops(room));
  let a, b, ans;
  if (op === "+") { a = rnd(2, 8 + 4*room); b = rnd(2, 8 + 4*room); ans = a + b; }
  else if (op === "-") { a = rnd(8, 12 + 5*room); b = rnd(2, a - 1); ans = a - b; }
  else if (op === "×") { a = rnd(2, Math.min(12, 3 + Math.ceil(room*0.9))); b = rnd(2, Math.min(12, 4 + room)); ans = a * b; }
  else { b = rnd(2, Math.min(12, 3 + room)); const q = rnd(2, Math.min(12, 3 + room)); a = b * q; ans = q; }
  return { text:`${a} ${op} ${b}`, ans };
}

function hearts() { return "❤️".repeat(g.hp) + "🖤".repeat(MAX_HP - g.hp); }
function renderHud() {
  $("hud").innerHTML = g ? `<span>🚪 ${g.room}/${ROOMS}</span><span>${hearts()}</span><span>🪙 ${g.gold}</span><span>🔥 ${g.streak}</span>` : `<span class="muted">Best: 🪙 ${best.gold}</span>`;
}

function showStart() {
  g = null; renderHud();
  $("screen").innerHTML = `<h2 style="margin-top:0">Choose your dungeon</h2>
    <p class="muted">Defeat 10 monsters by solving their math puzzles. Right answers hit the monster, wrong ones let it hit you. Three right answers in a row make a 🔥 critical hit!</p>
    <div class="modes">${Object.entries(MODES).map(([k,m]) => `<button class="btn" data-mode="${k}">${m.name}<small>${m.note}</small></button>`).join("")}</div>
    <p class="muted" style="margin-bottom:0">Best run: 🪙 ${best.gold} gold, ${best.rooms} rooms cleared</p>`;
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => start(b.dataset.mode));
}

function start(mode) {
  g = { mode, room:1, hp:MAX_HP, gold:0, streak:0, mon:null, prob:null, msg:"", hurt:false };
  Profile.play("dungeon-math-quest");
  startRoom();
}
function startRoom() {
  const [emoji, name] = MONSTERS[g.room - 1];
  const hp = g.room === ROOMS ? 7 : 2 + Math.floor(g.room / 3);
  g.mon = { emoji, name: g.room === ROOMS ? "Boss " + name : name, hp, max:hp };
  g.prob = gen(g.room, g.mode);
  g.msg = `A wild ${g.mon.name} appears!`;
  renderBattle();
}

function renderBattle() {
  renderHud();
  const m = g.mon;
  $("screen").innerHTML = `
    <div class="arena">
      <div class="center" id="hero">🧙</div><div class="vs">⚔️</div>
      <div class="mon" id="mon"><div>${m.emoji}</div><div class="monname">${m.name}</div>
        <div class="bar"><i style="width:${m.hp / m.max * 100}%"></i></div></div>
    </div>
    <div class="problem">${g.prob.text} = ?</div>
    <form class="answer" id="f"><input id="inp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Your answer"><button class="btn" type="submit">Attack ⚔️</button></form>
    <div class="msg" id="msg">${g.msg}</div>`;
  $("f").onsubmit = e => { e.preventDefault(); submit(); };
  $("inp").focus();
}

function submit() {
  const raw = $("inp").value.trim();
  if (!/^-?\d+$/.test(raw)) { $("inp").value = ""; return; }
  const ok = parseInt(raw, 10) === g.prob.ans;
  if (ok) {
    g.streak++;
    const crit = g.streak % 3 === 0;
    const dmg = crit ? 2 : 1;
    g.mon.hp = Math.max(0, g.mon.hp - dmg);
    g.gold += 5;
    g.msg = crit ? `🔥 CRITICAL HIT! ${dmg} damage!` : `✅ Hit! ${g.prob.text} = ${g.prob.ans}`;
    if (g.mon.hp === 0) return roomClear();
    g.prob = gen(g.room, g.mode);
    renderBattle(); $("mon").classList.add("shake");
  } else {
    g.streak = 0; g.hp--; g.hurt = true;
    g.msg = `💥 Ouch! ${g.prob.text} = ${g.prob.ans}`;
    if (g.hp <= 0) return defeat();
    g.prob = gen(g.room, g.mode);
    renderBattle(); $("hero").classList.add("shake");
  }
}

function roomClear() {
  const loot = 10 * g.room;
  g.gold += loot;
  Profile.award("dungeon-math-quest", 1, "Room cleared");
  const heal = g.room % 3 === 0 && g.hp < MAX_HP;
  if (heal) g.hp++;
  renderHud();
  if (g.room === ROOMS) return victory();
  $("screen").innerHTML = `<div class="center"><div style="font-size:72px">${g.mon.emoji}💨</div>
    <h2>${g.mon.name} defeated!</h2>
    <p>You found <b>🪙 ${loot}</b> gold.${heal ? " A healing potion restores ❤️ 1 heart!" : ""}</p>
    <button class="btn" id="nx">Next room 🚪</button></div>`;
  $("nx").onclick = () => { g.room++; startRoom(); };
  $("nx").focus();
}
function recordBest(rooms) {
  best.gold = Math.max(best.gold, g.gold); best.rooms = Math.max(best.rooms, rooms); saveBest();
}
function victory() {
  recordBest(ROOMS);
  Profile.award("dungeon-math-quest", 5, "Dungeon cleared!");
  Profile.unlock("dmq-dragon");
  if (!g.hurt) Profile.unlock("dmq-flawless");
  $("screen").innerHTML = `<div class="center"><div style="font-size:72px">🏆</div><h2>You cleared the dungeon!</h2>
    <p>The dragon is defeated and you carry home <b>🪙 ${g.gold}</b> gold!</p>
    <button class="btn" id="again">Play again</button></div>`;
  $("again").onclick = showStart;
}
function defeat() {
  recordBest(g.room - 1); renderHud();
  $("screen").innerHTML = `<div class="center"><div style="font-size:72px">😵</div><h2>Your hero fell in room ${g.room}</h2>
    <p>You collected <b>🪙 ${g.gold}</b> gold and cleared ${g.room - 1} ${g.room === 2 ? "room" : "rooms"}. Heroes always come back stronger!</p>
    <div class="row"><button class="btn" id="retry">Try again</button><button class="btn alt" id="menu">Change dungeon</button></div></div>`;
  $("retry").onclick = () => start(g.mode);
  $("menu").onclick = showStart;
}

showStart();
</script>
</body>
</html>
