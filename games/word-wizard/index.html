<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Wizard</title>
<link rel="stylesheet" href="../../shared.css">
<style>
  .stage { text-align:center; padding:8px 0 4px; }
  .goblin { font-size:clamp(64px, 16vw, 100px); position:relative; display:inline-block; }
  .fx { position:absolute; left:50%; top:50%; font-size:56px; transform:translate(-50%,-50%); pointer-events:none; animation:fx .8s ease-out forwards; }
  @keyframes fx { from { opacity:1; transform:translate(-150%,-50%) scale(.6); } to { opacity:0; transform:translate(-50%,-80%) scale(1.5); } }
  .bar { height:12px; border-radius:6px; background:#2a3260; overflow:hidden; width:min(70vw, 280px); margin:4px auto 0; }
  .bar > i { display:block; height:100%; background:#b06bff; transition:width .4s; }
  .clue { font-size:18px; margin:10px 0 2px; text-align:center; }
  .cat { color:var(--accent); font-size:14px; text-align:center; }
  .slots, .tiles { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0; min-height:52px; }
  .slot { width:46px; height:52px; border-radius:10px; border:3px dashed #3a47a0; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:bold; }
  .slot.on { border-style:solid; border-color:var(--accent); background:var(--panel2); cursor:pointer; }
  .slot.lock { border-color:var(--good); cursor:default; }
  .tile { width:50px; height:56px; border-radius:10px; border:0; background:#4a3a9a; color:#fff; font-size:28px; font-weight:bold; cursor:pointer; font-family:inherit; box-shadow:0 4px 0 #2b2166; }
  .tile:active { transform:translateY(3px); box-shadow:0 1px 0 #2b2166; }
  .tile.used { visibility:hidden; }
  .timer { height:8px; border-radius:4px; background:#2a3260; overflow:hidden; margin:8px 0; }
  .timer > i { display:block; height:100%; background:var(--accent); width:100%; }
  .fld { width:100%; margin:5px 0; padding:9px 11px; border-radius:10px; border:2px solid #3a47a0; background:#0b1030; color:var(--ink); font-size:16px; font-family:inherit; }
  .fld:focus { outline:none; border-color:var(--accent); }
  .wlist { list-style:none; margin:6px 0 10px; padding:0; font-size:15px; }
  .wlist li { display:flex; gap:8px; align-items:center; padding:5px 0; border-top:1px solid #2a3260; }
  .wlist li span { flex:1; }
  .msg { min-height:26px; text-align:center; font-size:17px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../../">← Arcade</a>
    <h1>🧙 Word Wizard</h1>
    <div class="hud" id="hud"></div>
  </header>
  <div class="card" id="screen"><p class="muted center">Loading the spell book…</p></div>
</div>

<script src="../../profile.js"></script>
<script>
"use strict";
// Words live in words.json as { "word": "ATOM", "category": "Science", "clue": "..." } (see README).
// In memory each word is [WORD, category, clue].
let BASE_WORDS = [], WORDS = [];
const ROUNDS = 10, TIME = 35;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

let best = 0;
try { best = parseInt(localStorage.getItem("ww-best"), 10) || 0; } catch(e) {}

let g = null, tick = null;

function pickWord(round, used, source) {
  const band = round < 3 ? w => w[0].length <= 5 : round < 6 ? w => w[0].length === 6 : w => w[0].length >= 7;
  const pool = source.filter(w => band(w) && !used.has(w[0]));
  const left = source.filter(w => !used.has(w[0]));
  return shuffle(pool.length ? pool : left.length ? left : source)[0];
}
function scramble(word) {
  let s; do { s = shuffle(word.split("")); } while (s.join("") === word);
  return s.map(ch => ({ ch, used:false }));
}

function renderHud() {
  $("hud").innerHTML = g ? `<span>📜 ${Math.min(g.round + 1, ROUNDS)}/${ROUNDS}</span><span>⭐ ${g.score}</span><span>🔥 ${g.streak}</span>` : `<span class="muted">Best: ⭐ ${best}</span>`;
}
function showStart() {
  g = null; renderHud(); clearInterval(tick);
  const mine = customWords();
  if (mine.length < 10) onlyMine = false;
  $("screen").innerHTML = `<div class="center"><div style="font-size:72px">🧙✨</div><h2 style="margin-top:0">Unscramble the spell words!</h2>
    <p class="muted">Letters are jumbled. Tap them (or type) to spell the secret word and zap the goblin. Longer words are worth more. Use 💡 if you get stuck, but it costs points!</p>
    ${mine.length >= 10 ? `<p><label><input type="checkbox" id="only" ${onlyMine ? "checked" : ""}> Use only <b>my own words</b> (${mine.length})</label></p>` : ""}
    <div class="row"><button class="btn" id="go">Start casting ✨</button><button class="btn alt" id="mywords">✏️ My words (${mine.length})</button></div>
    <p class="muted">${WORDS.length} words in the spell book · Best score: ⭐ ${best}</p></div>`;
  $("go").onclick = start;
  $("mywords").onclick = showEditor;
  if ($("only")) $("only").onchange = e => { onlyMine = e.target.checked; };
}
function start() {
  g = { round:0, score:0, streak:0, used:new Set(), solved:0, source:onlyMine ? customWords().map(toWord) : WORDS };
  Profile.play("word-wizard");
  nextWord();
}
function nextWord() {
  if (g.round >= ROUNDS) return finish();
  const [word, cat, clue] = pickWord(g.round, g.used, g.source);
  g.used.add(word);
  Object.assign(g, { word, cat, clue, tiles:scramble(word), ans:[], locked:0, hints:0, wrong:0, left:TIME, over:false, msg:"" });
  render();
  clearInterval(tick);
  tick = setInterval(() => {
    if (g.over) return;
    g.left -= 0.25;
    $("tm").style.width = Math.max(0, g.left / TIME * 100) + "%";
    if (g.left <= 0) timeUp();
  }, 250);
}

function render() {
  renderHud();
  const slots = g.word.split("").map((_, i) => {
    const t = g.ans[i] != null ? g.tiles[g.ans[i]].ch : "";
    return `<div class="slot${t ? " on" : ""}${i < g.locked ? " lock" : ""}" data-i="${i}">${t}</div>`;
  }).join("");
  const tiles = g.tiles.map((t, i) => `<button class="tile${t.used ? " used" : ""}" data-t="${i}">${t.ch}</button>`).join("");
  $("screen").innerHTML = `
    <div class="stage"><div class="goblin" id="gob">👺</div>
      <div class="bar"><i style="width:${(1 - g.solved / ROUNDS) * 100}%"></i></div></div>
    <div class="cat">${esc(g.cat)} · ${g.word.length} letters</div>
    <div class="clue">${esc(g.clue)}</div>
    <div class="timer"><i id="tm" style="width:${g.left / TIME * 100}%"></i></div>
    <div class="slots" id="slots">${slots}</div>
    <div class="tiles" id="tiles">${tiles}</div>
    <div class="msg" id="msg">${g.msg}</div>
    <div class="row"><button class="btn alt" id="shuf">🔀 Shuffle</button><button class="btn alt" id="clr">⌫ Clear</button><button class="btn alt" id="hint">💡 Hint (−5)</button></div>`;
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => addTile(+b.dataset.t));
  document.querySelectorAll(".slot.on:not(.lock)").forEach(s => s.onclick = () => removeFrom(+s.dataset.i));
  $("shuf").onclick = () => { const free = g.tiles.map((t,i) => i).filter(i => !g.tiles[i].used); const chars = shuffle(free.map(i => g.tiles[i].ch)); free.forEach((i,k) => g.tiles[i].ch = chars[k]); render(); };
  $("clr").onclick = () => removeFrom(g.locked);
  $("hint").onclick = hint;
}

function addTile(i) {
  if (g.over || g.tiles[i].used || g.ans.length >= g.word.length) return;
  g.tiles[i].used = true; g.ans.push(i);
  render();
  if (g.ans.length === g.word.length) check();
}
function removeFrom(idx) {
  if (g.over) return;
  while (g.ans.length > Math.max(idx, g.locked)) g.tiles[g.ans.pop()].used = false;
  g.msg = ""; render();
}
function hint() {
  if (g.over || g.locked >= g.word.length - 1) return;
  removeFrom(g.locked);
  const need = g.word[g.locked];
  const ti = g.tiles.findIndex(t => !t.used && t.ch === need);
  if (ti < 0) return;
  g.tiles[ti].used = true; g.ans.push(ti); g.locked++; g.hints++;
  render();
}
function check() {
  const guess = g.ans.map(i => g.tiles[i].ch).join("");
  if (guess === g.word) return solved();
  g.wrong++; g.streak = 0;
  while (g.ans.length > g.locked) g.tiles[g.ans.pop()].used = false;
  g.msg = "Not quite, try again!";
  render(); $("slots").classList.add("shake");
}
function solved() {
  g.over = true; clearInterval(tick);
  const pts = Math.max(5, g.word.length * 10 + Math.round(g.left) - g.hints * 5 - g.wrong * 3);
  g.streak++;
  const bonus = g.streak >= 3 ? Math.round(pts * 0.5) : 0;
  g.score += pts + bonus; g.solved++;
  renderHud();
  $("gob").insertAdjacentHTML("beforeend", `<span class="fx">${["✨","🔥","⚡","❄️"][Math.floor(Math.random()*4)]}</span>`);
  $("msg").innerHTML = `<span class="good">✨ ${g.word}! +${pts}${bonus ? ` (+${bonus} streak bonus)` : ""}</span>`;
  $("tiles").style.opacity = .4;
  setTimeout(() => { g.round++; nextWord(); }, 1300);
}
function timeUp() {
  g.over = true; clearInterval(tick); g.streak = 0; renderHud();
  $("msg").innerHTML = `<span class="bad">⏰ Time's up! The word was <b>${g.word}</b></span>`;
  setTimeout(() => { g.round++; nextWord(); }, 1800);
}
function finish() {
  clearInterval(tick);
  const rank = g.score >= 700 ? "Archmage 🧙‍♂️👑" : g.score >= 450 ? "Sorcerer ⚡" : g.score >= 250 ? "Mage ✨" : "Apprentice 📖";
  const isBest = g.score > best;
  const bonus = g.score >= 700 ? 6 : g.score >= 450 ? 4 : g.score >= 250 ? 2 : 0;
  Profile.award("word-wizard", g.solved + bonus, `Spelled ${g.solved} words`);
  if (g.solved === ROUNDS) Profile.unlock("ww-perfect");
  if (g.score >= 700) Profile.unlock("ww-archmage");
  if (isBest) { best = g.score; try { localStorage.setItem("ww-best", String(best)); } catch(e) {} }
  renderHud();
  $("screen").innerHTML = `<div class="center"><div style="font-size:72px">${g.solved === ROUNDS ? "🏆" : "🎓"}</div><h2 style="margin-top:0">${rank}</h2>
    <p>You spelled <b>${g.solved}/${ROUNDS}</b> words and scored <b>⭐ ${g.score}</b>.${isBest ? " <br>🎉 New best score!" : ""}</p>
    <button class="btn" id="again">Cast again</button></div>`;
  $("again").onclick = start;
}

addEventListener("keydown", e => {
  if (!g || g.over || !g.word) return;
  if (e.key === "Backspace") { e.preventDefault(); if (g.ans.length > g.locked) { g.tiles[g.ans.pop()].used = false; g.msg = ""; render(); } return; }
  if (/^[a-z]$/i.test(e.key) && !e.metaKey && !e.ctrlKey) {
    const ti = g.tiles.findIndex(t => !t.used && t.ch === e.key.toUpperCase());
    if (ti >= 0) addTile(ti);
  }
});

// ---------- data loading + custom words ----------
const CUSTOM_KEY = "ww-custom";
let onlyMine = false;
const toWord = o => [o.word.toUpperCase(), o.category || "My words", o.clue];
function customWords() {
  try { const s = JSON.parse(localStorage.getItem(CUSTOM_KEY)); if (Array.isArray(s)) return s; } catch(e) {}
  return [];
}
function saveCustom(list) { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); return true; } catch(e) { return false; } }
function rebuildWords() { WORDS = BASE_WORDS.concat(customWords().map(toWord)); }
function checkWord(o) {
  if (!o || typeof o.word !== "string" || !/^[A-Za-z]{3,12}$/.test(o.word)) return "the word must be 3 to 12 letters (A-Z only)";
  if (typeof o.clue !== "string" || !o.clue.trim()) return "missing clue";
  if (o.clue.toUpperCase().includes(o.word.toUpperCase())) return "the clue contains the word";
  return null;
}
async function loadWords() {
  const r = await fetch("words.json");
  if (!r.ok) throw new Error("words.json (" + r.status + ")");
  const data = await r.json();
  const seen = new Set();
  data.forEach(o => { const bad = checkWord(o); if (bad) console.warn("Bad word entry " + JSON.stringify(o) + ": " + bad); if (seen.has(o.word)) console.warn("Duplicate word: " + o.word); seen.add(o.word); });
  BASE_WORDS = data.map(toWord);
}

function showEditor(msg) {
  clearInterval(tick);
  const list = customWords();
  const cats = [...new Set(WORDS.map(w => w[1]))].sort();
  $("screen").innerHTML = `<h2 style="margin-top:0">✏️ My words</h2>
    <p class="muted">Add your own spell words! Pick a word and write a clue that doesn't use the word itself.</p>
    <input class="fld" id="nw" maxlength="12" placeholder="The secret word (3 to 12 letters)" autocomplete="off" autocapitalize="characters">
    <input class="fld" id="nc" maxlength="24" list="cats" placeholder="Category (e.g. Space, Animals, My words)" autocomplete="off">
    <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <input class="fld" id="nl" maxlength="120" placeholder="Clue: describe it without saying it" autocomplete="off">
    <div id="nm" class="msg">${msg || ""}</div>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="nadd">Add word</button><button class="btn alt" id="nback">⬅️ Back</button></div>
    ${list.length ? `<h3>My ${list.length} word${list.length > 1 ? "s" : ""}</h3>
      <ul class="wlist">${list.map((c, i) => `<li><span><b>${esc(c.word.toUpperCase())}</b> <i class="muted">${esc(c.category || "My words")} · ${esc(c.clue)}</i></span><button class="chip" data-del="${i}">🗑️</button></li>`).join("")}</ul>
      <button class="btn alt" id="nexp" style="font-size:14px;padding:6px 12px">⬇️ Download as JSON</button>` : ""}`;
  $("nback").onclick = showStart;
  $("nadd").onclick = () => {
    const o = { word: $("nw").value.trim().toUpperCase(), category: $("nc").value.trim() || "My words", clue: $("nl").value.trim() };
    if (!/^[A-Z]{3,12}$/.test(o.word)) return showEditor("Use only letters (A to Z): 3 to 12 of them.");
    if (WORDS.some(w => w[0] === o.word)) return showEditor("That word is already in the spell book!");
    if (!o.clue) return showEditor("Write a clue so the wizard can help.");
    if (o.clue.toUpperCase().includes(o.word)) return showEditor("Oops, the clue gives the word away. Describe it without using it!");
    const l = customWords(); l.push(o);
    const ok = saveCustom(l); rebuildWords();
    if (ok) Profile.unlock("wordsmith");
    showEditor(ok ? `<span class="good">✅ ${esc(o.word)} added!</span>` : "Couldn't save in this browser.");
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const l = customWords(); l.splice(+b.dataset.del, 1); saveCustom(l); rebuildWords(); showEditor("Deleted."); });
  if ($("nexp")) $("nexp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(customWords().map(c => ({ word:c.word.toUpperCase(), category:c.category || "My words", clue:c.clue })), null, 2)], { type:"application/json" }));
    a.download = "my-words.json"; a.click(); URL.revokeObjectURL(a.href);
  };
}

loadWords().then(() => { rebuildWords(); showStart(); }).catch(err => {
  console.error(err);
  $("screen").innerHTML = `<div class="center"><h2>😕 Couldn't load the words</h2><p>${esc(err.message)}</p>
    <p class="muted">If you opened this page by double-clicking the file, browsers block loading <code>words.json</code>. Start a local server from the arcade folder:</p>
    <pre style="background:#0b1030;padding:8px;border-radius:8px;display:inline-block">python3 -m http.server 8800</pre>
    <p class="muted">Then open http://localhost:8800/games/word-wizard/ or play the online version.</p></div>`;
});
</script>
</body>
</html>
